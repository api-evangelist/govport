name: Govport
description: 'GovPort is a Software-as-a-Service platform built specifically for government contractors
  (GovCons) to manage subcontractor performance, compliance, and collaboration. It centralizes critical
  contract records, sends primes and subs automated requirements to keep every party compliant, and lets
  GovCons securely share and manage deliverables with one another across teams. Positioned as subcontractor
  management software for the federal contracting ecosystem, GovPort emphasizes high levels of data privacy
  and security. It was surfaced as a portfolio company of QED Investors and added to the API Evangelist
  network; the company references APIs in its terms of service but does not publish a public developer
  portal, API reference, or machine-readable specification at this time.'
